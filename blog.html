<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة Clean Quality | نصائح وإرشادات التنظيف الاحترافي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; }
        .header { background: linear-gradient(135deg, #1a365d 0%, #2a4365 100%); color: white; text-align: center; padding: 40px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .articles-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .article-card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 20px; border-right: 5px solid #3182ce; text-decoration: none; color: inherit; transition: transform 0.2s; }
        .article-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .article-card h2 { color: #2c5282; font-size: 20px; margin-bottom: 10px; }
        .article-card p { color: #4a5568; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>نصائح وإرشادات Clean Quality</h1>
        <p>دليلك الشامل للحفاظ على نظافة ونقاء منزلك ومكتبك بأحدث التقنيات</p>
    </div>

    <div class="container">
        <div class="articles-grid">
            </div>
    </div>

</body>
</html>
